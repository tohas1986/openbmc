# This is the most basic ntp configuration file
# The driftfile must remain in a place specific to this
# machine - it records the machine specific clock error
driftfile /var/lib/ntp/drift
# This should be a server that is close (in IP terms)
# to the machine.  Add other servers as required.
# Unless you un-comment the line below ntpd will sync
# only against the local system clock.
#
# server time.server.example.com
#
# Using local hardware clock as fallback
# Disable this when using ntpd -q -g -x as ntpdate or it will sync to itself
server ntp.yandex.net
server hwwbus.pt.cloud.yandex-team.ru
server hwwbus.gpn.cloud.yandex-team.ru
server pool.ntp.org
restrict default
restrict ::1
restrict -6 default kod notrap nomodify noquery limited
disable auth
multicastclient ff05::101
interface listen eth0
interface listen eth1
