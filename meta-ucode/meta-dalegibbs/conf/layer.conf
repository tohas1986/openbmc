# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "dalegibbs-layer"
BBFILE_PATTERN_dalegibbs-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_dalegibbs-layer = "5"
LAYERSERIES_COMPAT_dalegibbs-layer = "nanbield scarthgap"
